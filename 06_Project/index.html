<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keyboard Key Storer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>⚡ Keyboard Key Storer ⚡</h1>
    <p class="subtitle">Press any key to see the magic ✨</p>

    <div id="display-box">
      <span id="current-key"></span>
    </div>

    <div class="log-section">
      <h2>Key History</h2>
      <div id="key-log"></div>
    </div>

    <button id="clear-btn">🧹 Clear History</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
